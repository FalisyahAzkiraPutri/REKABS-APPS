function openModal(title, bodyHtml, buttons, wide){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" style="${wide?'max-width:640px;':''}">
        <div class="modal-head"><h3>${title}</h3><button class="btn btn-ghost btn-sm" id="modal-close">&times;</button></div>
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-foot" id="modal-foot"></div>
      </div>
    </div>
  `;
  const foot = document.getElementById('modal-foot');
  buttons.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = b.cls || 'btn';
    btn.textContent = b.label;
    btn.addEventListener('click', async ()=>{
      if(b.onClick){
        const ok = await b.onClick();
        if(ok===false) return;
      } else {
        closeModal();
      }
    });
    foot.appendChild(btn);
  });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function downloadBackupFile(){
  const backup = {
    _meta:{app:'SIKESISWAAN', exportedAt:new Date().toISOString(), tahunAjaran: state.profile.tahunAjaran},
    students: state.students, attendance: state.attendance, prestasi: state.prestasi,
    pelanggaran: state.pelanggaran, referensi: state.referensi, profile: state.profile,
    rombel: state.rombel, guru: state.guru, ekskul: state.ekskul, ekskulPeserta: state.ekskulPeserta,
    konseling: state.konseling, tataTertib: state.tataTertib, guruAttendance: state.guruAttendance,
    agenda: state.agenda, osis: state.osis, proker: state.proker, kesehatan: state.kesehatan,
    suratPeringatan: state.suratPeringatan
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayStr();
  const taLabel = (state.profile.tahunAjaran||'').replace(/[^\w]/g,'-');
  a.href = url; a.download = `cadangan-kesiswaan${taLabel?'-'+taLabel:''}-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadCSV(filename, header, rows){
  const esc = v => { const s=String(v??''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const csv = [header.map(esc).join(','), ...rows.map(r=>r.map(esc).join(','))].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  const eyeOffPath = `<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.44 3.5M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/>`;
  document.getElementById('lock-toggle-pw').addEventListener('click', ()=>{
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    document.getElementById('lock-eye-icon').innerHTML = showing ? eyeOpenPath : eyeOffPath;
  });
  const submit = () => {
    if(input.value === state.profile.password){
      appUnlocked = true;
      root.innerHTML = '';
      document.getElementById('main').style.display = '';
      document.getElementById('sidebar').style.display = '';
      renderApp();
    } else {
      const errBox = document.getElementById('lock-err');
      errBox.textContent = 'Password salah. Coba lagi.';
      errBox.classList.add('show');
      input.value=''; input.focus();
    }
  };
  document.getElementById('lock-submit').addEventListener('click', submit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

/* ============================================================
   GLOBAL SEARCH
   ============================================================ */
function setupGlobalSearch(){
  const input = document.getElementById('global-search');
  const results = document.getElementById('global-search-results');
  if(!input) return;
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    if(!q){ results.classList.remove('open'); results.innerHTML=''; return; }
    const studentMatches = state.students.filter(s=>s.nama.toLowerCase().includes(q) || s.nis.includes(q)).slice(0,5)
      .map(s=>({type:'siswa', id:s.id, nama:s.nama, sub:s.nis+' · '+s.kelas}));
    const guruMatches = state.guru.filter(g=>g.nama.toLowerCase().includes(q)).slice(0,5)
      .map(g=>({type:'guru', id:g.id, nama:g.nama, sub:g.jabatan||'Guru/Tenaga Pendidik'}));
    const all = [...studentMatches, ...guruMatches].slice(0,8);
    if(all.length===0){
      results.innerHTML = `<div class="gs-empty">Tidak ditemukan.</div>`;
    } else {
      results.innerHTML = all.map(item=>`
        <div class="gs-item" data-type="${item.type}" data-id="${item.id}">
          <div class="avatar" style="width:26px;height:26px;font-size:10px;">${initials(item.nama)}</div>
          <div><div class="gs-name">${escapeHtml(item.nama)}</div><div class="gs-sub">${escapeHtml(item.sub)}</div></div>
        </div>
      `).join('');
      results.querySelectorAll('.gs-item').forEach(el=>{
        el.addEventListener('click', ()=>{
          input.value=''; results.classList.remove('open'); results.innerHTML='';
          document.getElementById('sidebar').classList.remove('open');
          if(el.dataset.type==='siswa'){ detailStudentId = el.dataset.id; detailMonthOffset=0; openDetailModal(); }
          else { openGuruDetailModal(el.dataset.id); }
        });
      });
    }
    results.classList.add('open');
  });
  document.addEventListener('click', e=>{
    if(!e.target.closest('.sidebar-search-wrap')){ results.classList.remove('open'); }
  });
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  setView(`<div class="empty-state" style="padding-top:80px;">Memuat data...</div>`);
  await loadAll();
  setupGlobalSearch();
  if(state.profile.loginEnabled && state.profile.password){
    showLockScreen();
  } else {
    appUnlocked = true;
    renderApp();
  }
})();
</script>
